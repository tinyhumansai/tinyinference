[package]
name = "tinyinference-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider routing, authentication protocols, and error classification for TinyInference."
documentation = "https://docs.rs/tinyinference-providers"
readme = "../../README.md"
keywords = ["llm", "inference", "oauth", "providers"]
categories = ["api-bindings", "authentication"]

[dependencies]
async-trait = { workspace = true }
base64 = "0.23"
rand = "0.10"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The host decides which driver backs this storage port.
tinystoragedrivers-api = { version = "2.1.2", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "6355ea266e6701c3b90b0f357cdaba8baa7f260d" }
tracing = { workspace = true }
url = { workspace = true }
zeroize = "1"

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net"] }

[lints]
workspace = true
