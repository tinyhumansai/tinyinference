[package]
name = "tinyinference-decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Jev and Levanto Sage decision model APIs for TinyInference."
documentation = "https://docs.rs/tinyinference-decisions"
readme = "../../docs/tinyinference-decisions.md"
keywords = ["ai", "classification", "decision-models", "sage"]
