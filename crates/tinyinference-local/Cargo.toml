[package]
name = "tinyinference-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local runtime discovery, model selection, and installers for TinyInference."
documentation = "https://docs.rs/tinyinference-local"
readme = "../../README.md"
keywords = ["llm", "inference", "ollama", "local-ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
bytes = { workspace = true }
base64 = "0.22"
flate2 = { workspace = true }
futures = { workspace = true }
futures-util = "0.3"
hex = { workspace = true }
log = "0.4"
once_cell = { workspace = true }
parking_lot = "0.12"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tinyinference-core = { version = "0.3.0", path = "../tinyinference-core" }
tinyinference-llm = { version = "0.3.0", path = "../tinyinference-llm" }
tinyinference-embeddings = { version = "0.3.0", path = "../tinyinference-embeddings" }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
