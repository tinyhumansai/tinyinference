[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package. Keeping the root virtual leaves room for future protocol-specific
# crates without making the core inference crate structurally special.
members = ["crates/*"]
# `vendor/` is reserved for pinned external source dependencies. `worktrees/`
# holds linked checkouts of this repository; both are excluded so Cargo never
# walks into another workspace and reports duplicate packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyinference"

[workspace.dependencies]
# Async provider and embedding traits do not prescribe a concrete runtime.
async-trait = "0.1"
# Reference-counted network chunks keep the SSE pipeline copy-free.
bytes = "1"
# Focused HTTP-date parsing for provider Retry-After headers.
httpdate = "1"
# The provider-neutral streaming abstraction and stream combinators.
futures = "0.3"
# Hosted provider and embedding transports.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Public request, response, message, tool, and usage shapes are serializable.
serde = { version = "1", features = ["derive"] }
# Provider wire payloads and JSON-schema tool declarations.
serde_json = "1"
# Deterministic request fingerprints for response caching.
sha2 = "0.11"
# The crate-wide typed inference error.
thiserror = "2"
# Rate limiting, retry delays, and async tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Test-only diagnostic assertions.
tracing = "0.1"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library code must not ship placeholders.
todo = "warn"
unimplemented = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
